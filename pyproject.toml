[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-intelligence"
version = "1.0.0"
description = "End-to-end EV charging analytics data platform"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3.0", "streamlit>=1.35"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
